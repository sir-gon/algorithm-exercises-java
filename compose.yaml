---

services:
  algorithm-exercises-java-test:
    image: algorithm-exercises-java:test
    build:
      context: .
      target: testing
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info} ## (1) ## info | debug
      BRUTEFORCE: ${BRUTEFORCE:-false} ## (1) ## true | false
    volumes:
      # - ./build:/app/build
      - ./:/app
    profiles: [testing]

  algorithm-exercises-java-lint:
    image: algorithm-exercises-java:lint
    build:
      context: .
      target: lint
    # environment:
    #   LOG_LEVEL: ${LOG_LEVEL:-info} ## (1) ## info | debug
    #   BRUTEFORCE: ${BRUTEFORCE:-false} ## (1) ## true | false
    volumes:
      - ./:/app
    profiles: [lint]

  markdownlint:
    image: goncl/markdownlint-cli:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
    profiles: ["lint"]

  yamllint:
    image: goncl/yamllint:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
    profiles: ["lint"]

  prettier:
    image: goncl/prettier:3.9.8
    working_dir: /workspace
    volumes:
      - ./:/workspace
    profiles: ["lint"]

  algorithm-exercises-java-dev:
    image: algorithm-exercises-java:dev
    build:
      context: .
      target: development
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info} ## (1) ## info | debug
      BRUTEFORCE: ${BRUTEFORCE:-false} ## (1) ## true | false
    volumes:
      - ./:/app
    profiles: [development]

  algorithm-exercises-java:
    image: algorithm-exercises-java:latest
    build:
      context: .
      target: production
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info} ## (1) ## info | debug
      BRUTEFORCE: ${BRUTEFORCE:-false} ## (1) ## true | false
    # volumes:
    #   - ./:/app
    profiles: [production]
## REFERENCES:
## (1) Passing Environment variable with fallback value:
##    https://stackoverflow.com/a/70772707/6366150
##
